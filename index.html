<!doctype html>
<html lang="en">
<!--
  DataMap — single-file app. Host this one file anywhere over https (GitHub Pages works).

  SETUP
  1. Firebase console: create a project, add a Web app, and paste its config into CONFIG below.
  2. Authentication > Sign-in method: enable Email/Password. Users tab: add your login.
  3. Firestore Database: create it (production mode). Rules tab: paste the rules below and Publish.
     Replace you@example.com with your email (lowercase). Add more people inside the brackets.

  FIRESTORE RULES
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      function allowed() {
        return request.auth != null && request.auth.token.email in ['you@example.com'];
      }
      match /{document=**} { allow read, write: if allowed(); }
    }
  }

  With the CONFIG values left empty the app runs in local mode (data saved in this browser only).
-->

<style>
:root{
  color-scheme:light;
  --bg:#f4f3ee; --panel:#ffffff; --card:#fbfaf7; --ink:#1d1c19; --muted:#6c6a62; --line:#e2dfd5; --line2:#c9c5b6;
  --accent:#2f6f5e; --accent-ink:#ffffff; --danger:#c2432f; --grid:#d8d5c9; --hl:#fff1a8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --c0:#2f8f7a; --c1:#3b7dd8; --c2:#7c5cd6; --c3:#c8508a; --c4:#d2543f; --c5:#d98a2b; --c6:#8a9a2f; --c7:#64748b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body.dragging-ui{user-select:none;-webkit-user-select:none;cursor:grabbing}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}

/* header */
#top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px 6px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
#stats{color:var(--muted);font-size:12px;white-space:nowrap}
.search{flex:1 1 200px;min-width:150px;position:relative}
.search>svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.icon-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}

/* board tabs */
#tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;align-items:stretch}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);white-space:nowrap}
.tab-main{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border:0;background:none;cursor:pointer;color:inherit}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab[aria-selected="true"] .tab-main{padding-right:4px}
.tab.add .tab-main{padding-right:12px}
#banner{background:color-mix(in srgb,var(--danger) 14%,var(--panel));padding:6px 12px;font-size:13px;border-bottom:1px solid var(--line)}

/* views */
main{flex:1;min-height:0;display:flex}
#board,#folders,#results{flex:1;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch}
#plane{position:relative;min-width:max(100%,var(--pw,0px));min-height:max(100%,var(--ph,0px));
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
.empty{position:absolute;left:50%;top:80px;transform:translateX(-50%);width:min(360px,calc(100vw - 40px));text-align:center;color:var(--muted);
  background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:16px}
.empty p{margin:0 0 14px}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent);background-color:var(--hl)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 2s ease-out}

/* sections */
.section{position:absolute;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--sc);border-radius:11px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.section.lifting{z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.s-head{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px;background:color-mix(in srgb,var(--sc) 13%,var(--panel));border-radius:8px 8px 0 0}
.grip{cursor:grab;touch-action:none;color:var(--muted);display:grid;place-items:center;width:22px;min-height:26px;flex:none;border-radius:5px}
.grip:hover{color:var(--ink)}
.s-title{flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;font-weight:650;font-size:14px;padding:3px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-count{font-size:11px;color:var(--muted);padding:0 2px}
.s-desc{padding:4px 10px 0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-cards{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:40px}
.s-cards:empty::before{content:"No cards yet";color:var(--muted);font-size:12px;text-align:center;padding:8px;border:1px dashed var(--line);border-radius:8px}
.quick{margin:0 8px 8px;padding:6px 9px;border:1px dashed var(--line);border-radius:8px;background:transparent;font-size:14px}
.quick:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--card)}

/* cards */
.card{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px 7px 3px;cursor:pointer;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--sc) 55%,var(--line))}
.card.dragging{opacity:.3}
.card.ghost{position:fixed;z-index:3000;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3);transform:rotate(1.5deg);opacity:.96;cursor:grabbing}
.c-main{flex:1;min-width:0}
.c-title{font-weight:600;overflow-wrap:anywhere}
.c-body{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12px;color:var(--muted)}
.c-meta a{color:var(--accent);text-decoration:none;display:inline-flex;gap:3px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;padding:0 7px;border-radius:20px;background:color-mix(in srgb,var(--sc,var(--accent)) 16%,transparent)}
.section.drop-target{outline:2px solid var(--accent);outline-offset:2px}
#searchbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-bottom:1px solid var(--line);font-size:13px}
#searchbar .sp{flex:1}
.match{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}
.match.cur{outline-color:var(--accent);outline-width:3px}
.card.match{background:color-mix(in srgb,var(--hl) 45%,var(--card))}
.frow.match,.irow.match{background:color-mix(in srgb,var(--hl) 55%,transparent)}
.tab .n{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 6px;margin-left:2px;font-weight:600}

/* folder board: connected tree */
.ftree{max-width:780px;margin:0 auto;padding:12px 12px 90px}
.ftool{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ftool .sp{flex:1}
.ftool .cnt-all{color:var(--muted);font-size:13px}
.tnode{position:relative}
.tnode.root{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px 6px 8px;margin-bottom:10px;box-shadow:var(--shadow)}
.frow{display:flex;align-items:center;min-height:36px;padding:0 4px 0 6px;border-radius:9px;cursor:pointer}
.frow:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.frow .caret{width:22px;height:22px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;flex:none;transition:transform .12s}
.frow .caret.open{transform:rotate(90deg)}
.frow .caret.leaf{visibility:hidden}
.frow .fi{width:18px;margin-left:2px;color:var(--accent)}
.frow .fi.leaf{color:var(--muted)}
.frow .nm{flex:1;min-width:0;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.root>.frow .nm{font-weight:650;font-size:15px}
.frow .cnt{font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:20px;padding:0 8px;margin-left:6px;white-space:nowrap;flex:none}
@media(max-width:520px){.frow .cnt{display:none}}
.children>.tnode.item::before{height:16px}
.children>.tnode.item:not(:last-child)::after{top:16px}
.irow{display:flex;align-items:flex-start;gap:8px;min-height:32px;padding:6px 8px;border-radius:8px;cursor:pointer}
.irow:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.irow .di{color:var(--muted);margin-top:1px}
.irow .in{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere}
.frow .acts{display:flex;opacity:0;margin-left:4px}
.frow:hover .acts,.frow:focus-within .acts{opacity:1}
@media(hover:none){.frow .acts{opacity:1}}
.children{margin-left:39px;padding-left:16px}
.children>.tnode::before{content:"";position:absolute;left:-16px;top:0;width:16px;height:18px;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-bottom-left-radius:8px}
.children>.tnode:not(:last-child)::after{content:"";position:absolute;left:-16px;top:18px;bottom:0;border-left:1.5px solid var(--line2)}
.fempty{text-align:center;color:var(--muted);padding:50px 10px}
.fempty p{margin:0 0 14px}

/* search results */
.res-wrap{max-width:820px;margin:0 auto;padding:12px 12px 80px}
.res-head{color:var(--muted);margin:2px 0 12px}
.res-group{margin-bottom:18px}
.res-gh{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:6px}
.res-gh small{color:var(--muted);font-weight:400}
.res-list{display:flex;flex-direction:column;gap:6px}
.res{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;min-width:0}
.res:hover{border-color:var(--muted)}
.res .k{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;height:18px;line-height:16px;flex:none;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.res .t{font-weight:600;overflow-wrap:anywhere}
.res .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.res .b{color:var(--muted);font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.res-none{color:var(--muted);text-align:center;padding:60px 10px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0 0 12px;font-size:16px}
.f{margin-bottom:11px}
.f>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input[type=text],.f input[type=url],.f textarea,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:16px}
.f textarea{resize:vertical;min-height:70px}
.f .bad{border-color:var(--danger)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card));font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.foot .spacer{flex:1}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}

#auth{position:fixed;inset:0;z-index:5000;background:var(--bg);display:grid;place-items:center;padding:20px}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;width:min(380px,100%)}
.auth-card h2{margin:0 0 4px;font-size:18px}
.auth-card p{margin:0 0 14px;color:var(--muted)}
.auth-card .f input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:16px}
.auth-err{color:var(--danger);font-size:13px;min-height:18px;margin:2px 0 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:10px;z-index:4000;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 24px);box-shadow:var(--shadow)}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

<script>
/* =====================================================================

/* =====================================================================
   DATA MODEL  (independent of the UI)
   ---------------------------------------------------------------------
   Every document below is a Firestore document in a top-level collection
   of the same name. Access is controlled by firestore.rules.

   boards/<id>     { name, kind:'board'|'folders', order, createdAt, updatedAt }
                   kind 'board'   = free-form board of sections + cards
                   kind 'folders' = folder tree

   sections/<id>   { boardId, name, description, url, color, x, y, width, ... }
                   A place where information lives (app, drive, tool…).
                   Legacy sections without boardId belong to board 'main'.

   cards/<id>      { sectionId, title, body, url, tags[], ... }
                   One piece of information stored in a section.
                   Moving a card only changes sectionId.
                   Everything is displayed sorted A–Z (boards, cards, folders,
                   folder contents, search results); no manual order is stored.

   folders/<id>    { boardId, parentId|null, name, createdAt, updatedAt }
                   One node of a folder tree. (Older docs may still carry a
                   `note` field; it is ignored and left untouched.)

   contents/<id>   { boardId, folderId, name, createdAt, updatedAt }
                   One item stored inside a folder, shown inline in the tree.
   ===================================================================== */

const COLORS = ['c0','c1','c2','c3','c4','c5','c6','c7'];
const WIDTHS = {S:240, M:290, L:380};
const KINDS = {board:'Free-form board', folders:'Folder structure'};
const COLLS = ['boards','sections','cards','folders','contents'];

const S = { boards:new Map(), sections:new Map(), cards:new Map(), folders:new Map(), contents:new Map(),
  got:{boards:false,sections:false,cards:false,folders:false,contents:false},
  boardId:null, q:'', listView:false, matchIdx:-1, store:null, refocus:null, collapsed:new Set(), flash:null, mainCreating:false };
try{ S.boardId = localStorage.getItem('im.board'); }catch(e){}

/* ---------- storage adapters (same interface) ---------- */
const chains = new Map();
function enqueue(key, fn){
  const prev = chains.get(key) || Promise.resolve();
  const p = prev.catch(()=>{}).then(fn);
  chains.set(key, p);
  const done = ()=>{ if(chains.get(key)===p) chains.delete(key); };
  p.then(done, done);
  return p;
}
/* ---- Firebase Firestore (cloud) ---- */
function firebaseStore(db){
  // Keep a local copy so DataMap opens instantly and works offline; writes sync when back online.
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  const wrap = p => Promise.resolve(p).catch(e=>{ throw {code:(e&&e.code)||'error', message:(e&&e.message)||''}; });
  return {
    mode:'cloud',
    async start(){},
    subscribe(coll, cb, err){
      return db.collection(coll).onSnapshot(snap=>{
        const m = new Map();
        snap.docs.forEach(d=>m.set(d.id, {...d.data(), id:d.id}));
        cb(m);
      }, err);
    },
    set(coll,id,d){ const {id:_, ...rest} = d; return enqueue(coll+'/'+id, ()=>wrap(db.collection(coll).doc(id).set(rest))); },
    update(coll,id,p){ return enqueue(coll+'/'+id, ()=>wrap(db.collection(coll).doc(id).update(p))); },
    remove(coll,id){ return enqueue(coll+'/'+id, ()=>wrap(db.collection(coll).doc(id).delete())); }
  };
}

/* ---- Local mode (this browser only) ---- */
function localStore(){
  const KEY = 'im.local.v1';
  const data = {}, subs = {};
  COLLS.forEach(c=>{ data[c]=new Map(); subs[c]=[]; });
  try{
    const saved = JSON.parse(localStorage.getItem(KEY)||'{}');
    COLLS.forEach(c=>Object.entries(saved[c]||{}).forEach(([id,d])=>data[c].set(id,{...d,id})));
  }catch(e){}
  const persist = ()=>{ try{ const o={}; COLLS.forEach(c=>{ o[c]={}; data[c].forEach((d,id)=>{ const {id:_,...r}=d; o[c][id]=r; }); }); localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} };
  const emit = c => { persist(); subs[c].forEach(cb=>cb(new Map(data[c]))); };
  return {
    mode:'local',
    async start(){},
    subscribe(c, cb){ subs[c].push(cb); setTimeout(()=>cb(new Map(data[c])),0); return ()=>{}; },
    async set(c,id,d){ data[c].set(id,{...d,id}); emit(c); },
    async update(c,id,p){ if(!data[c].has(id)) throw {code:'invalid_argument'}; data[c].set(id,{...data[c].get(id),...p}); emit(c); },
    async remove(c,id){ data[c].delete(id); emit(c); }
  };
}

/* ---------- domain operations ---------- */
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => Date.now();
const boardOf = s => s.boardId || 'main';
const cmp = (a,b)=>String(a||'').localeCompare(String(b||''),undefined,{sensitivity:'base',numeric:true});
const byName = (x,y)=>cmp(x.name,y.name);
const byTitle = (x,y)=>cmp(x.title,y.title);

async function run(promise){
  try{ return await promise; }
  catch(e){
    const code = e && e.code;
    if(code==='quota_exceeded') toast('Storage limit reached — delete some items first.');
    else if(code==='invalid_argument' || code==='not-found') toast('Couldn’t save — that item no longer exists.');
    else if(code==='permission-denied' || code==='unauthenticated') toast('Not allowed — sign in again, or check the allowed emails in firestore.rules.');
    else if(code==='resource-exhausted') toast('Firebase quota reached for today. Try again later.');
    else if(code==='unavailable') toast('You appear to be offline — changes will sync when you reconnect.');
    else toast('Couldn’t save ('+(code||'error')+'). Try again.');
    return null;
  }
}

const Model = {
  /* boards */
  boardsSorted(){ return [...S.boards.values()].sort(byName); },
  addBoard(d){ const id=uid('b'); const t=now();
    return run(S.store.set('boards',id,{name:'Board',kind:'board',...d,createdAt:t,updatedAt:t})).then(r=>r===null?null:id); },
  updateBoard(id,p){ return run(S.store.update('boards',id,{...p,updatedAt:now()})); },
  async deleteBoard(id){
    for(const s of Model.sectionsOf(id)){
      for(const c of Model.cardsIn(s.id)) await run(S.store.remove('cards',c.id));
      await run(S.store.remove('sections',s.id));
    }
    for(const c of Model.contentsOf(id)) await run(S.store.remove('contents',c.id));
    for(const f of Model.foldersOf(id)) await run(S.store.remove('folders',f.id));
    return run(S.store.remove('boards',id));
  },

  /* sections */
  sectionsOf(bid){ return [...S.sections.values()].filter(s=>boardOf(s)===bid); },
  sectionsSorted(bid){ return Model.sectionsOf(bid).sort(byName); },
  sectionsByPosition(bid){ return Model.sectionsOf(bid).sort((a,b)=>((a.y||0)-(b.y||0))||((a.x||0)-(b.x||0))); },
  addSection(d){ const id=uid('s'); const t=now(); return run(S.store.set('sections',id,{name:'',description:'',url:'',color:'c0',x:24,y:24,width:WIDTHS.M,...d,createdAt:t,updatedAt:t})).then(()=>id); },
  updateSection(id,p){ return run(S.store.update('sections',id,{...p,updatedAt:now()})); },
  async deleteSection(id, moveToId){
    const cards = Model.cardsIn(id);
    if(moveToId){
      for(const c of cards){ await run(S.store.update('cards',c.id,{sectionId:moveToId,updatedAt:now()})); }
    } else {
      for(const c of cards){ await run(S.store.remove('cards',c.id)); }
    }
    return run(S.store.remove('sections',id));
  },

  /* cards */
  cardsIn(sectionId){ return [...S.cards.values()].filter(c=>c.sectionId===sectionId).sort(byTitle); },
  addCard(d){ const id=uid('c'); const t=now(); return run(S.store.set('cards',id,{title:'',body:'',url:'',tags:[],...d,createdAt:t,updatedAt:t})).then(()=>id); },
  updateCard(id,p){ return run(S.store.update('cards',id,{...p,updatedAt:now()})); },
  saveCardFull(card){ return run(S.store.set('cards',card.id,{...card,updatedAt:now()})); },
  deleteCard(id){ return run(S.store.remove('cards',id)); },
  async moveCard(id, toSectionId){
    const card = S.cards.get(id); if(!card || card.sectionId===toSectionId) return;
    return Model.updateCard(id,{sectionId:toSectionId});
  },

  /* folders */
  foldersOf(bid){ return [...S.folders.values()].filter(f=>f.boardId===bid); },
  tree(bid){
    const fs = Model.foldersOf(bid), byId = new Map(fs.map(f=>[f.id,f])), kids = new Map();
    fs.forEach(f=>{ const p=(f.parentId&&byId.has(f.parentId))?f.parentId:'_root'; if(!kids.has(p)) kids.set(p,[]); kids.get(p).push(f); });
    kids.forEach(a=>a.sort(byName));
    return {byId, kids};
  },
  descendants(bid,id){
    const {kids}=Model.tree(bid); const out=[]; const seen=new Set([id]);
    const walk=x=>(kids.get(x)||[]).forEach(c=>{ if(seen.has(c.id)) return; seen.add(c.id); out.push(c.id); walk(c.id); });
    walk(id); return out;
  },
  addFolder(d){ const id=uid('f'); const t=now();
    return run(S.store.set('folders',id,{name:'Folder',parentId:null,...d,createdAt:t,updatedAt:t})).then(r=>r===null?null:id); },
  updateFolder(id,p){ return run(S.store.update('folders',id,{...p,updatedAt:now()})); },
  async deleteFolder(id){
    const f = S.folders.get(id); if(!f) return;
    const ids = new Set(Model.descendants(f.boardId,id).concat(id));
    for(const c of [...S.contents.values()]) if(ids.has(c.folderId)) await run(S.store.remove('contents',c.id));
    for(const x of ids) await run(S.store.remove('folders',x));
  },
  moveFolder(id,newParentId){ return Model.updateFolder(id,{parentId:newParentId||null}); },
  folderPath(f){
    const path=[f]; let p=f.parentId, guard=0;
    while(p && S.folders.has(p) && guard++<50){ const pf=S.folders.get(p); path.unshift(pf); p=pf.parentId; }
    return path;
  },

  /* folder contents */
  contentsOf(bid){ return [...S.contents.values()].filter(c=>c.boardId===bid); },
  contentsIn(fid){ return [...S.contents.values()].filter(c=>c.folderId===fid).sort(byName); },
  async addContents(boardId, folderId, names){
    const t=now();
    await Promise.all(names.map(n=>run(S.store.set('contents',uid('i'),{boardId,folderId,name:n,createdAt:t,updatedAt:t}))));
  },
  updateContent(id,p){ return run(S.store.update('contents',id,{...p,updatedAt:now()})); },
  deleteContent(id){ return run(S.store.remove('contents',id)); }
};

/* =====================================================================
   UI helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const board = $('#board'), plane = $('#plane'), foldersEl = $('#folders'), resultsEl = $('#results');
let qInput = null;

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?'':v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return el;
}
const ICONS = {

  folderOpen:'<path d="M3 18V7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v2"/><path d="M3 18l2.6-7.2A2 2 0 0 1 7.5 9.5H21a1 1 0 0 1 .95 1.3L19.6 17.4A2 2 0 0 1 17.7 19H4a1 1 0 0 1-1-1z"/>',
  caret:'<path d="M9 6l6 6-6 6"/>',
  up:'<path d="M6 15l6-6 6 6"/>',

function ic(name,size=16){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width',size); s.setAttribute('height',size);
  s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','1.8');
  s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');

function safeHref(u){

}

function folderSelect(bid, blocked, allowTop, value){
  const {kids} = Model.tree(bid);
  const sel = h('select');
  if(allowTop) sel.append(h('option',{value:'',text:'Top level'}));
  const walk = (pid,depth)=>(kids.get(pid)||[]).forEach(c=>{
    if(blocked.has(c.id)) return;
    sel.append(h('option',{value:c.id,text:'\u00A0\u00A0\u00A0'.repeat(depth)+(depth?'└ ':'')+(c.name||'Untitled')}));
    walk(c.id,depth+1);
  });
  walk('_root',0);
  sel.value = value||'';
  return sel;
}

/* ---------- free-form layout helpers ---------- */
function measured(id){ const el = plane.querySelector('[data-id="'+id+'"]'); return el ? {w:el.offsetWidth,h:el.offsetHeight} : null; }
function findSpot(bid, w){
  const rects = Model.sectionsByPosition(bid).map(s=>{ const m=measured(s.id); return {x:s.x||0,y:s.y||0,w:(m&&m.w)||s.width||WIDTHS.M,h:(m&&m.h)||200}; });
  const ph = 180, gap = 16;
  for(let y=24; y<6000; y+=40){
    for(let x=24; x<2600; x+=40){
      const ok = rects.every(r=> x+w+gap<=r.x || x>=r.x+r.w+gap || y+ph+gap<=r.y || y>=r.y+r.h+gap);
      if(ok) return {x,y};
    }
  }
  return {x:24,y:24};
}
async function arrange(){
  const b = curBoard(); if(!b) return;
  const secs = Model.sectionsOf(b.id).sort(byName); if(!secs.length) return;
  const before = secs.map(s=>({id:s.id,x:s.x,y:s.y}));
  const colW = Math.max(...secs.map(s=>s.width||WIDTHS.M)) + 24;
  const cols = Math.max(1, Math.floor((board.clientWidth-24)/colW));
  const heights = new Array(cols).fill(24);
  const moves = [];
  secs.forEach((s,i)=>{
    const c = i % cols;
    const m = measured(s.id);
    moves.push({id:s.id, x:24+c*colW, y:heights[c]});
    heights[c] += ((m&&m.h)||200) + 24;
  });
  for(const m of moves) await Model.updateSection(m.id,{x:m.x,y:m.y});
  toast('Sections arranged A–Z, left to right.',{label:'Undo',run:async()=>{ for(const x of before) await Model.updateSection(x.id,{x:x.x,y:x.y}); }});
}

/* =====================================================================
   Rendering
   ===================================================================== */
let renderQueued = false, drag = null;
function scheduleRender(){
  if(renderQueued) return; renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued=false; if(drag){ drag.pending=true; return; } render(); });
}
const ready = () => COLLS.every(c=>S.got[c]);

function ensureMainBoard(){
  if(!ready() || S.boards.size || S.mainCreating || !S.store) return;
  S.mainCreating = true;
  const t = now();
  run(S.store.set('boards','main',{name:'Main board',kind:'board',order:1000,createdAt:t,updatedAt:t}));
}

function render(){
  ensureMainBoard();
  const b = curBoard();
  const searching = !!S.q;
  const listMode = searching && S.listView;
  const isFolders = !!b && b.kind==='folders';
  const groups = searching && ready() ? searchAll() : null;
  renderChrome(b, groups);
  board.hidden = listMode || isFolders;
  foldersEl.hidden = listMode || !isFolders;
  resultsEl.hidden = !listMode;
  if(listMode) renderResults();
  else if(isFolders) renderFolders(b);
  else renderBoard(b);
  renderSearchBar(b, groups);
  applyFlash();
}

function stepMatch(dir){
  const scope = board.hidden ? foldersEl : board;
  const els = [...scope.querySelectorAll('.card.match,.section.match,.frow.match,.irow.match')];
  if(!els.length) return;
  const n = els.length;
  S.matchIdx = S.matchIdx<0 ? (dir>0?0:n-1) : (S.matchIdx+dir+n)%n;
  document.querySelectorAll('.match.cur').forEach(x=>x.classList.remove('cur'));
  const el = els[S.matchIdx];
  el.classList.add('cur');
  try{ el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}); }catch(e){}
}

function renderSearchBar(b, groups){
  const bar = $('#searchbar');
  bar.replaceChildren();
  if(!S.q){ bar.hidden = true; return; }
  bar.hidden = false;
  if(!groups){ bar.append(h('span',{text:'Searching…'})); return; }
  let here=0, other=0, otherBoards=0;
  groups.forEach((a,bid)=>{ if(b && bid===b.id) here=a.length; else { other+=a.length; otherBoards++; } });
  const listMode = S.listView;
  let text;
  if(listMode){ const total=here+other; text = total+' result'+(total===1?'':'s')+' across '+groups.size+' board'+(groups.size===1?'':'s'); }
  else {
    text = here ? here+' match'+(here===1?'':'es')+' on this board' : 'No matches on this board';
    if(other) text += ' · '+other+' on '+otherBoards+' other board'+(otherBoards===1?'':'s')+' (see tab badges)';
  }
  bar.append(h('span',{text}), h('span',{class:'sp'}));
  if(!listMode && here){
    bar.append(
      h('button',{class:'btn sm','aria-label':'Previous match',title:'Previous match',onclick:()=>stepMatch(-1)}, ic('up',14)),
      h('button',{class:'btn sm','aria-label':'Next match',title:'Next match',onclick:()=>stepMatch(1)}, ic('down',14)));
  }
  bar.append(
    h('button',{class:'btn sm',onclick:()=>{ S.listView=!S.listView; S.matchIdx=-1; render(); }}, listMode?'Back to board':'Results list'),
    h('button',{class:'btn sm',onclick:()=>{ clearSearch(); render(); }}, 'Clear'));
}

function applyFlash(){

/* ---------- folder board: connected tree with inline contents ---------- */
function renderFolders(b){
  foldersEl.replaceChildren();
  const wrap = h('div',{class:'ftree'});
  foldersEl.append(wrap);
  if(!ready()){ wrap.append(h('div',{class:'fempty',text:'Loading…'})); return; }
  const {byId, kids} = Model.tree(b.id);
  const roots = kids.get('_root')||[];
  if(!roots.length){
    wrap.append(h('div',{class:'fempty'},
      h('p',{text:'No folders yet. Start with a top-level folder, then add subfolders and content inside it.'}),
      h('button',{class:'btn primary',onclick:()=>openFolderSheet({})}, ic('plus',14),'New folder')));
    return;
  }
  const items = new Map();
  Model.contentsOf(b.id).forEach(c=>{ if(!byId.has(c.folderId)) return; if(!items.has(c.folderId)) items.set(c.folderId,[]); items.get(c.folderId).push(c); });
  items.forEach(a=>a.sort(byName));
  const force = new Set();
  if(S.q){
    const markUp = fid=>{ let p=byId.get(fid), g=0; while(p && g++<50){ force.add(p.id); p = p.parentId ? byId.get(p.parentId) : null; } };
    byId.forEach(f=>{ if(f.parentId && hit(f.name)) markUp(f.parentId); });
    items.forEach((arr,fid)=>{ if(arr.some(i=>hit(i.name))) markUp(fid); });
  }
  const memo = new Map();
  const stat = f=>{
    if(memo.has(f.id)) return memo.get(f.id);
    memo.set(f.id,{fc:0,ic:0});
    let fc=0, n=(items.get(f.id)||[]).length;
    (kids.get(f.id)||[]).forEach(c=>{ const s=stat(c); fc+=1+s.fc; n+=s.ic; });
    const r={fc,ic:n}; memo.set(f.id,r); return r;
  };
  let totalItems = 0; items.forEach(a=>totalItems+=a.length);
  const expandable = [...byId.values()].filter(f=>(kids.get(f.id)||[]).length || (items.get(f.id)||[]).length);
  wrap.append(h('div',{class:'ftool'},
    h('span',{class:'cnt-all',text:byId.size+' folder'+(byId.size===1?'':'s')+' · '+totalItems+' item'+(totalItems===1?'':'s')}),
    h('span',{class:'sp'}),
    h('button',{class:'btn sm',onclick:()=>{ S.collapsed.clear(); render(); }},'Expand all'),
    h('button',{class:'btn sm',onclick:()=>{ expandable.forEach(f=>S.collapsed.add(f.id)); render(); }},'Collapse all')));

  const toggle = f=>{ if(S.collapsed.has(f.id)) S.collapsed.delete(f.id); else S.collapsed.add(f.id); render(); };
  const itemEl = it=>{
    const row = h('div',{class:'irow'+(S.q&&hit(it.name)?' match':''),'data-id':it.id,tabindex:'0',title:'Edit item',
        onclick:()=>openContentSheet({id:it.id}),
        onkeydown:e=>{ if(e.key==='Enter') openContentSheet({id:it.id}); }},
      h('span',{class:'di'}, ic('doc',15)),
      h('span',{class:'in'}, tx(it.name||'(unnamed)')));
    return h('div',{class:'tnode item'}, row);
  };
  const nodeEl = (f, isRoot)=>{
    const ch = kids.get(f.id)||[];
    const its = items.get(f.id)||[];
    const has = ch.length>0 || its.length>0;
    const open = has && (!S.collapsed.has(f.id) || force.has(f.id));
    const st = stat(f);
    const parts = [];
    if(st.fc) parts.push(st.fc+' folder'+(st.fc===1?'':'s'));
    if(st.ic) parts.push(st.ic+' item'+(st.ic===1?'':'s'));
    const row = h('div',{class:'frow'+(S.q&&hit(f.name)?' match':''),'data-id':f.id,tabindex:'0',
        onclick:e=>{ if(e.target.closest('.acts')) return; if(has) toggle(f); },
        onkeydown:e=>{ if(e.key==='Enter' && e.target===row && has) toggle(f); }},
      h('span',{class:'caret'+(has?(open?' open':''):' leaf'),'aria-hidden':'true'}, ic('caret',14)),
      h('span',{class:'fi'+(has?'':' leaf')}, ic(open?'folderOpen':'folder',18)),
      h('span',{class:'nm',title:Model.folderPath(f).map(x=>x.name).join(' / ')}, tx(f.name||'Untitled')),
      parts.length ? h('span',{class:'cnt',text:parts.join(' · ')}) : null,
      h('span',{class:'acts'},
        h('button',{class:'icon-btn','aria-label':'Add content',title:'Add content',onclick:e=>{ e.stopPropagation(); openContentSheet({folderId:f.id}); }}, ic('filePlus',16)),
        h('button',{class:'icon-btn','aria-label':'Add subfolder',title:'Add subfolder',onclick:e=>{ e.stopPropagation(); openFolderSheet({parentId:f.id}); }}, ic('folderPlus',16)),
        h('button',{class:'icon-btn','aria-label':'Edit folder',title:'Edit folder',onclick:e=>{ e.stopPropagation(); openFolderSheet({id:f.id}); }}, ic('edit',14))));
    const node = h('div',{class:'tnode'+(isRoot?' root':'')}, row);
    if(open){
      const box = h('div',{class:'children'});
      ch.forEach(c=>box.append(nodeEl(c,false)));
      its.forEach(it=>box.append(itemEl(it)));
      node.append(box);
    }
    return node;
  };
  roots.forEach(f=>wrap.append(nodeEl(f,true)));
}

/* ---------- universal search ---------- */
function terms(){ return S.q.split(/\s+/).filter(Boolean); }
function hit(text){ const t=(text||'').toLowerCase(); return terms().every(w=>t.includes(w)); }
function hl(text){
  text = String(text==null?'':text);
  const ws = terms(); if(!ws.length || !text) return [text];
  const re = new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return text.split(re).map((p,i)=> i%2 ? h('mark',{text:p}) : p);
}
function snippet(text){
  text = String(text||''); if(!text) return '';
  const low = text.toLowerCase(); let idx = -1;
  for(const w of terms()){ const i=low.indexOf(w); if(i>=0){ idx=i; break; } }
  if(idx<0) return text.slice(0,160);
  const s = Math.max(0, idx-50);
  return (s>0?'…':'')+text.slice(s, s+180);
}

function searchAll(){
  const groups = new Map();
  const add = (bid,item)=>{ if(!groups.has(bid)) groups.set(bid,[]); groups.get(bid).push(item); };
  S.boards.forEach(b=>{ if(hit(b.name)) add(b.id,{kind:'board',id:b.id,title:b.name}); });
  S.sections.forEach(s=>{
    const bid = boardOf(s); if(!S.boards.has(bid)) return;
    if(hit((s.name||'')+' '+(s.description||'')+' '+(s.url||''))) add(bid,{kind:'section',id:s.id,title:s.name,body:s.description,url:s.url});
  });
  S.folders.forEach(f=>{
    if(!S.boards.has(f.boardId)) return;
    if(hit(f.name)){ const path=Model.folderPath(f).slice(0,-1).map(x=>x.name).join(' / '); add(f.boardId,{kind:'folder',id:f.id,title:f.name,sub:path?'in '+path:'top level'}); }
  });
  S.contents.forEach(c=>{
    const f = S.folders.get(c.folderId); if(!f || !S.boards.has(f.boardId)) return;
    if(hit(c.name)) add(f.boardId,{kind:'item',id:c.id,folderId:f.id,title:c.name,sub:'in '+Model.folderPath(f).map(x=>x.name).join(' / ')});
  });
  S.cards.forEach(c=>{
    const s = S.sections.get(c.sectionId); if(!s) return;
    const bid = boardOf(s); if(!S.boards.has(bid)) return;
    if(hit([c.title,c.body,c.url,(c.tags||[]).join(' ')].join(' '))) add(bid,{kind:'card',id:c.id,title:c.title,sub:'in '+(s.name||'Untitled'),body:c.body,tags:c.tags,url:c.url});
  });
  return groups;
}

function expandFrom(folderId){
  let p = S.folders.get(folderId), g = 0;
  while(p && g++<50){ S.collapsed.delete(p.id); p = p.parentId ? S.folders.get(p.parentId) : null; }
}
function goTo(bid, item){
  if(item.kind==='folder'){ const f=S.folders.get(item.id); if(f && f.parentId) expandFrom(f.parentId); }
  if(item.kind==='item') expandFrom(item.folderId);
  S.flash = item.kind==='board' ? null : {kind:item.kind,id:item.id};
  S.listView = false; S.matchIdx = -1;
  selectBoard(bid);
}

function renderResults(){
  resultsEl.replaceChildren();
  const wrap = h('div',{class:'res-wrap'});
  resultsEl.append(wrap);
  if(!ready()){ wrap.append(h('div',{class:'res-none',text:'Loading…'})); return; }
  const groups = searchAll();
  let total = 0; groups.forEach(a=>total+=a.length);
  if(!total){ wrap.append(h('div',{class:'res-none',text:'Nothing found on any board for “'+S.q+'”.'})); return; }
  wrap.append(h('div',{class:'res-head',text:total+' result'+(total===1?'':'s')+' across '+groups.size+' board'+(groups.size===1?'':'s')}));
  const order = {board:0,section:1,folder:2,item:3,card:4};
  let shown = 0; const CAP = 250;
  Model.boardsSorted().forEach(b=>{
    const items = groups.get(b.id); if(!items) return;
    items.sort((x,y)=>(order[x.kind]-order[y.kind])||cmp(x.title,y.title));
    const list = h('div',{class:'res-list'});
    for(const it of items){
      if(shown++>=CAP) break;
      const href = it.url ? safeHref(it.url) : null;
      list.append(h('div',{class:'res',tabindex:'0',onclick:e=>{ if(e.target.closest('a')) return; goTo(b.id,it); },onkeydown:e=>{ if(e.key==='Enter') goTo(b.id,it); }},
        h('span',{class:'k',text:it.kind}),
        h('div',{style:'min-width:0;flex:1'},
          h('div',{class:'t'}, hl(it.title||'(untitled)')),
          it.sub ? h('div',{class:'s'}, it.sub) : null,
          it.body ? h('div',{class:'b'}, hl(snippet(it.body))) : null,
          (it.tags&&it.tags.length) ? h('div',{class:'tags'}, it.tags.map(t=>h('span',{class:'tag'}, hl(t)))) : null,
          it.url ? h('div',{class:'c-meta'}, href ? h('a',{href,target:'_blank',rel:'noopener noreferrer'}, hostOf(it.url), ic('external',11)) : h('span',{text:it.url})) : null)));
    }
    wrap.append(h('div',{class:'res-group'},
      h('div',{class:'res-gh'}, ic(b.kind==='folders'?'folder':'board',15), b.name||'Untitled', h('small',{text:'('+items.length+')'})),
      list));
  });
  if(total>CAP) wrap.append(h('div',{class:'res-head',text:'Showing the first '+CAP+'. Refine your search to narrow it down.'}));
}

/* =====================================================================
   Drag & drop (free-form board)
   ===================================================================== */
function beginDragUi(){ document.body.classList.add('dragging-ui'); }
function endDragUi(){ document.body.classList.remove('dragging-ui'); }

function startCardDrag(e, cardId){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const el = e.currentTarget.closest('.card'); const r = el.getBoundingClientRect();
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  drag = {kind:'card', id:cardId, el, w:r.width, offX:e.clientX-r.left, offY:e.clientY-r.top, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, started:false, ghost:null, line:null, target:null, raf:0, pending:false};
  window.addEventListener('pointermove', onCardMove);
  window.addEventListener('pointerup', onCardUp);
  window.addEventListener('pointercancel', onCardUp);
}
function updateCardTarget(){
  drag.ghost.style.left = (drag.x-drag.offX)+'px'; drag.ghost.style.top = (drag.y-drag.offY)+'px';
  const el = document.elementFromPoint(drag.x, drag.y);
  const sec = el && el.closest ? el.closest('.section') : null;
  if(drag.hl && drag.hl!==sec){ drag.hl.classList.remove('drop-target'); drag.hl=null; }
  if(sec){ sec.classList.add('drop-target'); drag.hl=sec; drag.target={sectionId:sec.dataset.id}; }
  else drag.target = null;
}
function cardLoop(){
  if(!drag || drag.kind!=='card' || !drag.started) return;
  const r = board.getBoundingClientRect(), m = 48; let dx=0, dy=0;
  if(drag.y<r.top+m) dy=-14; else if(drag.y>r.bottom-m) dy=14;
  if(drag.x<r.left+m) dx=-14; else if(drag.x>r.right-m) dx=14;
  if(dx||dy){ board.scrollLeft+=dx; board.scrollTop+=dy; updateCardTarget(); }
  drag.raf = requestAnimationFrame(cardLoop);
}
function onCardMove(e){
  if(!drag) return;
  drag.x=e.clientX; drag.y=e.clientY;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy)<5) return;
    drag.started = true; beginDragUi();
    const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.style.width = drag.w+'px'; g.removeAttribute('tabindex');
    document.body.append(g); drag.ghost = g; drag.el.classList.add('dragging');
    drag.raf = requestAnimationFrame(cardLoop);
  }
  e.preventDefault();
  updateCardTarget();
}
async function onCardUp(){
  window.removeEventListener('pointermove', onCardMove);
  window.removeEventListener('pointerup', onCardUp);
  window.removeEventListener('pointercancel', onCardUp);
  const d = drag; if(!d) return;
  cancelAnimationFrame(d.raf);
  if(d.hl) d.hl.classList.remove('drop-target');
  if(d.ghost) d.ghost.remove();
  d.el.classList.remove('dragging');
  endDragUi();
  drag = null;
  if(d.started && d.target){ await Model.moveCard(d.id, d.target.sectionId); }
  if(d.pending || d.started) scheduleRender();
}

function startSectionDrag(e, sectionId){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const sec = S.sections.get(sectionId); if(!sec) return;
  const el = e.currentTarget.closest('.section');
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  drag = {kind:'section', id:sectionId, el, sx:e.clientX, sy:e.clientY, ox:sec.x||0, oy:sec.y||0, scx:board.scrollLeft, scy:board.scrollTop, started:false, nx:sec.x||0, ny:sec.y||0, pending:false};
  window.addEventListener('pointermove', onSecMove);
  window.addEventListener('pointerup', onSecUp);
  window.addEventListener('pointercancel', onSecUp);
}
function onSecMove(e){
  if(!drag) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy)<4) return;
    drag.started=true; beginDragUi(); drag.el.classList.add('lifting');
  }
  e.preventDefault();
  drag.nx = Math.max(0, drag.ox + (e.clientX-drag.sx) + (board.scrollLeft-drag.scx));
  drag.ny = Math.max(0, drag.oy + (e.clientY-drag.sy) + (board.scrollTop-drag.scy));
  drag.el.style.left = drag.nx+'px'; drag.el.style.top = drag.ny+'px';
}
async function onSecUp(){
  window.removeEventListener('pointermove', onSecMove);
  window.removeEventListener('pointerup', onSecUp);
  window.removeEventListener('pointercancel', onSecUp);
  const d = drag; if(!d) return;
  d.el.classList.remove('lifting'); endDragUi(); drag = null;
  if(d.started){
    const x = Math.round(d.nx/10)*10, y = Math.round(d.ny/10)*10;
    d.el.style.left = x+'px'; d.el.style.top = y+'px';
    if(x!==d.ox || y!==d.oy) await Model.updateSection(d.id,{x,y});
  }
  if(d.pending) scheduleRender();
}

/* =====================================================================
   Init  (auth + storage)
   ===================================================================== */
let authRef = null;
function showBanner(msg){ const b=$('#banner'); b.textContent=msg; b.hidden=false; }

async function signOut(){
  try{ if(authRef) await authRef.signOut(); }catch(e){}
  location.reload();
}

function friendlyAuthError(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Wrong email or password.';
  if(/too-many-requests/.test(c)) return 'Too many attempts. Wait a few minutes and try again.';
  if(/network-request-failed/.test(c)) return 'Network error. Check your connection.';
  if(/operation-not-allowed/.test(c)) return 'Email/password sign-in is not enabled in Firebase yet.';
  return (e && e.message) || 'Sign-in failed.';
}

function showLogin(auth){
  return new Promise(resolve=>{
    const email = h('input',{type:'email',autocomplete:'username',inputmode:'email',autocapitalize:'off',placeholder:'you@example.com'});
    const pass = h('input',{type:'password',autocomplete:'current-password',placeholder:'Password'});
    const err = h('div',{class:'auth-err',text:''});
    const btn = h('button',{class:'btn primary',type:'button',style:'width:100%;justify-content:center',text:'Sign in'});
    const go = async()=>{
      if(!email.value.trim()||!pass.value){ err.textContent='Enter your email and password.'; return; }
      btn.disabled=true; btn.textContent='Signing in…'; err.textContent='';
      try{ await auth.signInWithEmailAndPassword(email.value.trim(), pass.value); }
      catch(e){ err.textContent = friendlyAuthError(e); btn.disabled=false; btn.textContent='Sign in'; return; }
      ov.remove(); resolve();
    };
    btn.addEventListener('click',go);
    [email,pass].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
    const ov = h('div',{id:'auth'}, h('div',{class:'auth-card'},
      h('h2',{text:'DataMap'}), h('p',{text:'Sign in to continue.'}),
      h('div',{class:'f'}, h('label',{text:'Email'}), email),
      h('div',{class:'f'}, h('label',{text:'Password'}), pass),
      err, btn));
    document.body.append(ov);
    setTimeout(()=>email.focus(),30);
  });
}

function setupPWA(){
  if(!/^https?:$/.test(location.protocol)) return;          // manifests need http(s)
  const base = location.href.split(/[?#]/)[0];
  const dir = base.replace(/[^/]*$/,'');
  const manifest = { id:base, name:'DataMap', short_name:'DataMap', description:'A visual map of where your information lives.',
    start_url:base, scope:dir, display:'standalone', background_color:'#f4f3ee', theme_color:'#2f6f5e',
    icons:[
      {src:ICON_192, sizes:'192x192', type:'image/png', purpose:'any'},
      {src:ICON_512, sizes:'512x512', type:'image/png', purpose:'any'},
      {src:ICON_MASK, sizes:'512x512', type:'image/png', purpose:'maskable'}
    ] };
  try{
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    const l = document.createElement('link'); l.rel='manifest'; l.href=url; document.head.append(l);
  }catch(e){}
}

(async function init(){
  try{ setupPWA(); }catch(e){}
  render();
  // Accepts either shape: my CONFIG = { FIREBASE:{…} } block, or Firebase's own `const firebaseConfig = {…}` snippet pasted as-is.
  const fc = (typeof CONFIG!=='undefined' && CONFIG.FIREBASE) || (typeof firebaseConfig!=='undefined' ? firebaseConfig : {});
  if(!fc.apiKey || !fc.projectId){
    showBanner('Local mode — data is saved only in this browser. Add your Firebase config at the top of this file to sync online.');
    S.store = localStore();
  } else {
    if(typeof firebase==='undefined' || !firebase.firestore || !firebase.auth){ showBanner('Could not load Firebase. Check your internet connection and reload.'); return; }
    try{ if(!firebase.apps.length) firebase.initializeApp(fc); }
    catch(e){ showBanner('Firebase config problem: '+((e&&e.message)||e)); return; }
    authRef = firebase.auth();
    const user = await new Promise(res=>{ const un = authRef.onAuthStateChanged(u=>{ un(); res(u); }); });
    if(!user) await showLogin(authRef);
    authRef.onAuthStateChanged(u=>{ if(!u) location.reload(); });
    $('#btnSignOut').hidden = false;
    S.store = firebaseStore(firebase.firestore());
  }
  const onErr = e=>{
    const c = e && e.code;
    if(c==='permission-denied') showBanner('Access denied. Publish firestore.rules and make sure your email is in its allowed list.');
    else showBanner('Sync problem ('+((e&&(c||e.message))||'error')+'). Reload the page.');
  };
  COLLS.forEach(c=>{
    S.store.subscribe(c, m=>{ S[c]=m; S.got[c]=true; scheduleRender(); }, onErr);
  });
  try{ await S.store.start(); }catch(e){ onErr(e); }
})();
</script>
